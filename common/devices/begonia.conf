# Xiaomi Redmi Note 8 Pro (begonia)
NAME="Xiaomi Redmi Note 8 Pro (begonia)"
KIND=phone
SOC="MediaTek Helio G90T (MT6785)"

# Bootloader is Little Kernel (lk), boots Android boot.img v2 directly into DRAM at 0x40080000
BOOT_BASE=0x40078000
KERNEL_OFFSET=0x00008000
LOADER_LOAD_ADDR=0x40080000
PAYLOAD_BASE=0x40080000
PHYS_BASE=0x40000000

# Live MediaTek LK Framebuffer: 1080 x 2340 @ stride 4320, RGBX8888
FB_BASE=0x7E605000
FB_WIDTH=1080
FB_HEIGHT=2340
FB_STRIDE=4320
FB_DEPTH=32

# GICv3 MMIO
GIC_DIST=0x0C000000
GIC_REDIST=0x0C040000

# Architectural Timer: 13.0 MHz (CNTFRQ_EL0)
TIMER_FREQ=13000000

# Heterogeneous CPU topology: 6xA55 (little, 0x000..0x005), 2xA76 (big, 0x100..0x101)
CORES=8
SMALL_CORES=0x3F

# Storage: UFS 2.1 (0x11270000), MicroSD (0x11240000)
# Touchscreen: FocalTech FT8719 / FT5446 on I2C0 @ 0x11007000 (slave 0x38)
# Ramoops: 0x4d05f000 (256 KiB)
# ATF Carveout: 0x47c00000 (4 MiB)

BOOTARGS="-v debug=0x10008e keepsyms=1 rd=md0 cs_enforcement_disable=1 amfi_get_out_of_my_way=0x1 wpdebug=1"
DEFAULT_SECS=900
USERLAND_VARS=""
FIRMWARE=""
